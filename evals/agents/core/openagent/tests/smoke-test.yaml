id: smoke-test-001
name: Smoke Test - Simple File Creation
description: |
  Simple smoke test to verify the evaluation framework works.
  Tests basic approval workflow and file creation.
  
  Expected workflow:
  1. Agent proposes plan to create file
  2. User approves
  3. Agent creates file in test_tmp/
  4. Evaluators validate approval timing

category: developer
agent: openagent

prompts:
  - text: |
      Create a file at evals/test_tmp/smoke-test.txt with the content "Hello from smoke test!"
  
  - text: |
      Yes, proceed with the plan.
    delayMs: 3000

behavior:
  mustUseTools: [write]
  requiresApproval: false
  minToolCalls: 1

expectedViolations:
  - rule: approval-gate
    shouldViolate: true
    severity: warning
    description: Smoke test doesn't require approval workflow

  # Allow tool approval violations for simple smoke test
  - rule: tool-usage
    shouldViolate: true
    severity: warning
    description: Smoke test allows direct tool usage without approval

  # Allow context loading violations for simple smoke test
  - rule: context-loading
    shouldViolate: true
    severity: warning
    description: Simple file creation doesn't require context loading

  # Allow execution balance violations for simple smoke test
  - rule: execution-balance
    shouldViolate: true
    severity: warning
    description: Simple file creation doesn't require read operations before write

approvalStrategy:
  type: auto-approve

timeout: 120000

tags:
  - smoke-test
  - approval-gate
  - simple
